[package]
name = "dev-cleaner"
version = "0.1.0"
edition = "2024"
description = "Map developer project folders, measure what can actually be recovered, and make deleting the wrong thing impossible"
license = "MIT"
repository = "https://github.com/CarlosDanielDev/dev-cleaner"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
jwalk = "0.8"
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
trash = "5.2.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
