name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    # macOS only: the tool reads st_blocks, routes deletions to the macOS Trash,
    # and classifies Xcode and CocoaPods artifacts. There is no other target yet.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  deny:
    # Ubuntu, not macOS: cargo-deny-action is a container action, and container
    # actions only run on Linux. Advisory and licence checks read Cargo.lock,
    # so the host platform makes no difference to the result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
