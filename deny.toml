[advisories]
yanked = "deny"

[licenses]
# A tool that deletes files should not carry copyleft obligations users cannot
# audit. Permissive only; add an entry when a new dependency needs one.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # foldhash, reached through rusqlite's statement cache. Permissive, OSI
    # approved, and imposes no obligation on a binary that links it.
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
